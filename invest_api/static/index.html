<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>סייר תיקי ההשקעות של חובב</title>
    <link rel="canonical" href="https://numbersguys.com/Invest1/">
    <link rel="stylesheet" href="static/app.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand-block" href="#intro">
          <svg class="brand-mark" viewBox="0 0 28 24" aria-hidden="true"><rect x="0" y="16" width="5" height="8" rx="1"/><rect x="7.5" y="11" width="5" height="13" rx="1"/><rect x="15" y="6" width="5" height="18" rx="1"/><rect x="22.5" y="0" width="5" height="24" rx="1"/></svg>
          <h1>סייר תיקי ההשקעות של חובב</h1>
        </a>
        <a class="topbar-link" href="#about">אודות האתר</a>
        <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="viewNav">
          <span class="nav-toggle-label"></span>
          <span class="nav-toggle-icon" aria-hidden="true"></span>
        </button>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <nav id="viewNav" class="nav" aria-label="חלקי אפליקציית ההשקעות"></nav>
        </aside>

        <section class="workspace">
          <section id="introHero" class="intro-hero" lang="he" hidden></section>

          <div class="view-heading">
            <div>
              <p id="viewKicker" class="kicker"></p>
              <h2 id="viewTitle"></h2>
              <p id="viewTakeaway" class="takeaway"></p>
            </div>
            <p id="rowCount" class="row-count"></p>
          </div>

          <section id="story" class="story-panel" lang="he" aria-label="הסבר בעברית"></section>

          <section id="simCard" class="sim-card" lang="he" aria-label="סימולציה" hidden>
            <p class="sim-card-kicker">סימולציית אירועי מס</p>
          </section>

          <form id="controls" class="controls"></form>

          <div id="message" class="message" role="status"></div>

          <section id="storyLead" class="story-panel story-lead" lang="he" hidden></section>

          <section id="metrics" class="metrics" aria-label="תוצאות מרכזיות"></section>

          <section class="chart-panel" aria-label="גרף השקעות">
            <div id="chart" class="chart"></div>
          </section>

          <section id="afterStory" class="story-panel story-panel-after" lang="he" aria-label="סיכום בעברית"></section>

          <section class="table-panel" aria-label="טבלת נתונים">
            <details class="table-toggle" data-table-key="data">
              <summary class="table-title">
                <h3>טבלת נתונים</h3>
                <p id="tableNote"></p>
              </summary>
              <div id="table" class="table-wrap"></div>
            </details>
          </section>

          <section id="resultNotes" class="result-notes" lang="he" aria-label="הנחות ומגבלות" hidden></section>

          <nav id="pageSteps" class="page-steps" lang="he" aria-label="העמוד הבא בסדר הקריאה" hidden></nav>

          <p class="site-note" lang="he">זה פרויקט אישי ולימודי. ייתכנו בו טעויות בחישובים וגם בחשיבה, ואני לא מומחה השקעות. זה לא ייעוץ פיננסי, וכל שימוש במידע הוא באחריות המשתמש. <a href="#about">עוד באודות</a></p>
        </section>
      </main>
    </div>

    <script type="module" src="static/app.js"></script>
    <script src="/AppUsage1/static/tracker.js" data-app="Invest1" data-endpoint="/AppUsage1/api/track" defer></script>
  </body>
</html>
